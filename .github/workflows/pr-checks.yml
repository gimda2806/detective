# PR 검사.
#
# 두 세션과 사건 생성 루틴이 같은 저장소를 동시에 고친다. 서로의 변경을
# 말로 알리는 방식은 사람이 전달책이 되어야 해서 지속되지 않는다 — 대신
# 깨뜨린 PR이 스스로 빨개지게 한다. main에서 getCase()가 동기에서
# 비동기로 바뀌었는데 다른 브랜치의 호출부가 그대로인 경우가 여기서 죽는다.
#
# 컴파일이 통과하는 의미 충돌(지워진 사건의 인물을 하드코딩한 코드 같은
# 것)은 여기서 잡히지 않는다. 그건 docs/conflict-watch-routine.md의 몫이다.
name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 바뀐 마스터를 base와 비교해 추려야 하므로 얕은 클론으로는 안 된다.
          fetch-depth: 0

      # package.json에 packageManager 필드가 없으므로 버전을 명시해야 한다.
      # 없으면 액션이 "No pnpm version is specified"로 죽는다.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 판정 코드를 만들었으면 docs/checks.md 에 그 줄이 있어야 한다
      # (2026-09-26 사용자 결정). 코드에서 코드를 뽑아 문서와 대조한다 — 1초.
      - name: 판정 코드 문서 대조
        run: npm run check:codes

      # 가장 빠른 신호부터. 시그니처 드리프트는 대부분 여기서 죽는다.
      - name: Typecheck
        run: npx tsc --noEmit

      # 기존 부채는 그대로 두되 늘어나는 것만 막는다. 줄였으면
      # npm run lint:baseline -- --write 로 기준선도 낮춰 주면 된다.
      # 세는 일을 스크립트에 맡기는 이유는 그 파일 주석에 적혀 있다 —
      # oxlint가 CI에서 리포터를 바꾸는 바람에 사람이 읽는 출력을 세면
      # 로컬과 CI의 숫자가 달라진다.
      - name: Lint (기준선 대비 증가 금지)
        run: npm run lint:baseline

      # build:cases 가 앞에 붙어 있다. 311건 전부 변환·검증되므로
      # 마스터 하나가 깨지면 여기서도 걸린다.
      - name: Build
        run: npm run build

      # 이 PR이 건드린 마스터만. 전부 도는 것은 몇 분이 걸리고,
      # 안 건드린 사건이 이 PR 때문에 깨질 일은 없다.
      - name: 바뀐 마스터 검사
        run: |
          # **PR 이 열린 시점의 base.sha 를 쓰면 안 된다**(2026-09-21 고침).
          # 그 값은 base 브랜치가 움직여도 따라오지 않으므로, PR 브랜치에 main 을
          # 병합하는 순간 **그 사이 main 이 건드린 마스터가 전부 「이 PR 이 바꾼
          # 것」으로 잡힌다.** 실제로 여섯 건짜리 PR 이 153건을 검사하다 남의
          # 사건에서 빨개졌다. 지금 base 브랜치 끝과의 merge-base 로 잡는다.
          # **아래 `if` 가 닿지 않는 자리였다**(2026-09-24 고침). 이 스텝의 셸은
          # `bash -e` 라서, `base=$(...)` 의 명령이 실패하면 **그 줄에서 스텝이
          # 죽는다** — 바로 밑에 「push 이벤트 등 — 건너뛴다」고 적어 둔 가드가
          # 한 번도 돌지 않았다. push 이벤트에서는 `github.base_ref` 가 비어
          # `origin/` 이 되므로 `merge-base` 가 128 로 죽고, 그래서 **main 에
          # 머지될 때마다 `check` 가 빨갛게 났다**(적어도 최근 네 머지 전부).
          # 앞 줄의 `--depth=0` 도 같은 자리에서 `fatal: depth 0 is not a
          # positive number` 를 찍는다 — 그쪽은 `|| true` 가 이미 받아 준다.
          git fetch --no-tags --depth=0 origin "${{ github.base_ref }}" || true
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD 2>/dev/null) || true
          if [ -z "$base" ]; then
            echo "base를 못 찾았다(push 이벤트 등) — 건너뛴다."
            exit 0
          fi
          # **`.offline.json` 도 잡는다**(2026-09-22). 패턴이 `*.master.json`
          # 뿐이라 오프라인 전용 판본은 CI 에서 check:case 를 한 번도 안 받았다 —
          # `/offline` 이 실제로 여는 파일이 그쪽인데도 그랬다. 폴더 이름에서
          # 사건 id 를 뽑으므로 두 파일 모두 같은 id 로 모인다.
          ids=$(git diff --name-only --diff-filter=d "$base"...HEAD \
                  -- 'data/pending-cases/*/*.master.json' \
                     'data/pending-cases/*/*.offline.json' \
                | sed -E 's#data/pending-cases/(CASE[0-9]+)/.*#\1#' | sort -u)
          if [ -z "$ids" ]; then
            echo "바뀐 마스터 없음."
            exit 0
          fi
          count=$(echo "$ids" | wc -l)
          echo "바뀐 마스터 ${count}건: $(echo $ids)"
          # check:case 는 매번 tsc 를 돌리므로 대량 변경에는 맞지 않는다.
          # 그런 PR은 npm run check:case 를 손으로 돌리는 편이 빠르다.
          if [ "$count" -gt 20 ]; then
            echo "::warning::20건이 넘어 건너뛴다 — 손으로 돌릴 것."
            exit 0
          fi
          # **새로 추가된 마스터는 새 사건으로 검사한다**(2026-09-27 사용자 결정 「입구
          # 막기」). 생성 루틴이 registry 등록을 같은 PR 에 넣으므로 registry 만 보면
          # CI 에서는 새 사건이 늘 「등록됨」으로 읽혀, 「새 사건 error」가 한 번도
          # 실제로 돌지 않았다. 추가된(A) 원본 파일이 곧 새 사건이다 — 그 id 는
          # `--new` 로 돌려 코퍼스 비율·오프라인 뼈대·대사 검사가 전부 error 다.
          new_ids=$(git diff --name-only --diff-filter=A "$base"...HEAD \
                  -- 'data/pending-cases/*/*.master.json' \
                | sed -E 's#data/pending-cases/(CASE[0-9]+)/.*#\1#' | sort -u)
          failed=0
          for id in $ids; do
            if echo "$new_ids" | grep -qx "$id"; then
              echo "$id: 새 사건 — 등록 무관 error 로 검사"
              npm run check:case "$id" -- --new || failed=1
            else
              npm run check:case "$id" || failed=1
            fi
          done
          # **완주 검사를 같이 돌린다**(2026-09-22 사용자 결정). `check:case` 가
          # 통과해도 오프라인에서 마지막 모순 단계까지 못 가는 사건이 들어올 수
          # 있고, 그러면 **영영 못 깨는 사건**이 된다 — 번호가 곧 막이라 그 막에
          # 플레이어가 갇힌다(CLAUDE.md 「막간과 막」).
          #
          # 자동으로 도는 자리가 없어서 **네 번 샜다**: CASE062 는 check:case 를
          # 통과하고 check:offline 에서만 잡혔고(생성 루틴은 그것을 안 돌린다),
          # CASE066·067·086 은 사람이 손으로 돌려 볼 때까지 아무도 몰랐다.
          #
          # 전수는 몇 분이라 PR 마다 돌리기엔 비싸고, 안 건드린 사건이 이 PR
          # 때문에 깨질 일은 없다 — 위 check:case 와 같은 판단이다. 없는 id 를
          # 넘기면 스크립트가 선다(0건으로 조용히 통과하지 않는다).
          npm run check:offline -- $ids || failed=1
          exit $failed
